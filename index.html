<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>CNN</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="Matrix.js"></script>
    <script src="CNNChannel.js"></script>
    <script src="CNNImage.js"></script>
    <script src="CNNKernel.js"></script>
    <script src="NeuralNetwork.js"></script>
    <script src="CNN.js"></script>
    <script src="trainer.js"></script>
    <script src="sketch.js"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            color: white;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .text {
            max-width: 320px;
            text-align: left;
            margin-bottom: 10px;
        }

        #canvas-holder {
            margin: 10px 0;
        }

        canvas {
            display: block;
            border: 1px solid #444;
        }

        .buttons {
            margin-top: 10px;
        }

        button {
            margin: 5px;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }

        #computerGuess {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- TEXT -->
        <div class="text">
            <p>
                You can draw on the black canvas using your mouse.<br>
                Click "Guess" to see the prediction.<br>
                Click "Clear" to reset.
            </p>
        </div>

        <!-- CANVAS goes HERE -->
        <div style="display: flex;gap: 40px;">
            <div id="canvas-holder"></div>
            <p id="computerGuess"></p>
        </div>

        <!-- BUTTONS -->
        <div class="buttons">
            <button id="clearButton">Clear</button>
            <button id="guessButton">Guess</button>
        </div>

        <!-- OUTPUT -->

    </div>
</body>

</html>
